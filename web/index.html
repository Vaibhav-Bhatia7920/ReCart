<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Assistant</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --primary: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 24px;
      color: var(--text);
    }

    .call-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }

    .call-btn.active {
      background: var(--danger);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.45);
      animation: pulse 1.5s infinite;
    }

    .call-btn svg {
      width: 44px;
      height: 44px;
      fill: currentColor;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    #status {
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--subtext);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Voice Agent</h1>
    <button id="callBtn" class="call-btn" onclick="toggleCall()" aria-label="Toggle Call">
      <!-- Microphone Icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <div id="status">Tap to speak</div>
  </div>

  <script>
    // Set your backend WebSocket URL (WSS for production, WS for localhost)
    const BACKEND_WS_URL = "wss://voice-api.vabhatia.dev/ws/call";

    let ws = null;
    let audioContext = null;
    let micStream = null;
    let processorNode = null;
    let playbackGain = null;
    let isCalling = false;
    let nextPlayTime = 0;
    let ttsSampleRate = 24000;
    let uplinkSampleRate = 16000;
    let outputEncoding = "linear16";
    let ttsPlaybackActive = false;
    let ttsGeneration = 0;
    const activeTtsSources = new Set();

    const callBtn = document.getElementById("callBtn");
    const statusText = document.getElementById("status");

    async function toggleCall() {
      if (!isCalling) {
        await startCall();
      } else {
        stopCall();
      }
    }

    function stopTtsPlayback() {
      ttsPlaybackActive = false;
      ttsGeneration += 1;
      nextPlayTime = 0;
      for (const source of activeTtsSources) {
        try {
          source.stop(0);
        } catch (_) {
          /* already stopped */
        }
        try {
          source.disconnect();
        } catch (_) {
          /* ignore */
        }
      }
      activeTtsSources.clear();
    }

    async function ensurePlaybackContext() {
      if (audioContext && audioContext.state === "closed") {
        audioContext = null;
        playbackGain = null;
      }
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({
          latencyHint: "interactive",
        });
        playbackGain = audioContext.createGain();
        playbackGain.connect(audioContext.destination);
      }
      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }
    }

    async function startCall() {
      statusText.innerText = "Connecting...";

      try {
        // Unlock output on the user gesture; creating the context only after WS "ready" leaves it suspended.
        await ensurePlaybackContext();

        ws = new WebSocket(BACKEND_WS_URL);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          statusText.innerText = "Connecting audio...";
        };

        ws.onmessage = async (event) => {
          const binary =
            event.data instanceof ArrayBuffer
              ? event.data
              : event.data instanceof Blob
                ? await event.data.arrayBuffer()
                : null;
          if (binary) {
            if (ttsPlaybackActive) {
              await playIncomingPcm(binary);
            }
            return;
          }
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === "ready") {
              if (msg.input_sample_rate) {
                uplinkSampleRate = msg.input_sample_rate;
              }
              if (msg.output_sample_rate) {
                ttsSampleRate = msg.output_sample_rate;
              }
              if (msg.encoding) {
                outputEncoding = msg.encoding;
              }
              if (!isCalling) {
                isCalling = true;
                callBtn.classList.add("active");
                await startAudioStream(msg.aec);
                ws.send(
                  JSON.stringify({
                    type: "client_hello",
                    aec: buildClientAecReport(),
                  })
                );
              }
              statusText.innerText = "Listening...";
            } else if (msg.type === "tts_start") {
              if (msg.sample_rate) {
                ttsSampleRate = msg.sample_rate;
              }
              if (msg.encoding) {
                outputEncoding = msg.encoding;
              }
              stopTtsPlayback();
              ttsPlaybackActive = true;
            } else if (msg.type === "tts_done") {
              stopTtsPlayback();
            } else if (msg.type === "tts_interrupt") {
              stopTtsPlayback();
              statusText.innerText = "Listening...";
            } else if (msg.type === "listening") {
              statusText.innerText = "Listening...";
            } else if (msg.type === "partial" && msg.text) {
              statusText.innerText = msg.text;
            } else if (msg.type === "final" && msg.text) {
              statusText.innerText = `You: ${msg.text}`;
            } else if (msg.type === "error") {
              statusText.innerText = msg.message || "Error";
            }
          } catch (_) {
            /* ignore non-JSON text */
          }
        };

        ws.onclose = () => stopCall();
        ws.onerror = (err) => {
          console.error("WebSocket connection error:", err);
          statusText.innerText = "Connection failed";
          stopCall();
        };
      } catch (err) {
        console.error("Initialization error:", err);
        statusText.innerText = "Microphone error";
        stopCall();
      }
    }

    function buildClientAecReport() {
      const track = micStream?.getAudioTracks?.()[0];
      const settings = track?.getSettings?.() || {};
      return {
        echoCancellation: settings.echoCancellation ?? null,
        noiseSuppression: settings.noiseSuppression ?? null,
        autoGainControl: settings.autoGainControl ?? null,
        sampleRate: audioContext?.sampleRate ?? null,
        channelCount: settings.channelCount ?? null,
      };
    }

    function downsampleFloat32(float32Data, inputRate, outputRate) {
      if (inputRate === outputRate) {
        return float32Data;
      }
      const ratio = inputRate / outputRate;
      const outLength = Math.floor(float32Data.length / ratio);
      const out = new Float32Array(outLength);
      for (let i = 0; i < outLength; i++) {
        const src = i * ratio;
        const idx = Math.floor(src);
        const frac = src - idx;
        const s0 = float32Data[idx] ?? 0;
        const s1 = float32Data[idx + 1] ?? s0;
        out[i] = s0 + (s1 - s0) * frac;
      }
      return out;
    }

    function float32ToInt16(float32Data) {
      const int16Buffer = new Int16Array(float32Data.length);
      for (let i = 0; i < float32Data.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Data[i]));
        int16Buffer[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return int16Buffer;
    }

    async function startAudioStream(serverAec) {
      const captureConstraints = serverAec?.capture_constraints || {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: false,
      };

      await ensurePlaybackContext();

      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: captureConstraints.echoCancellation ?? true,
          noiseSuppression: captureConstraints.noiseSuppression ?? true,
          autoGainControl: captureConstraints.autoGainControl ?? true,
        },
      });

      const track = micStream.getAudioTracks()[0];
      const sourceNode = audioContext.createMediaStreamSource(micStream);
      processorNode = audioContext.createScriptProcessor(4096, 1, 1);
      const silentGain = audioContext.createGain();
      silentGain.gain.value = 0;

      processorNode.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        const float32Data = e.inputBuffer.getChannelData(0);
        const resampled = downsampleFloat32(
          float32Data,
          audioContext.sampleRate,
          uplinkSampleRate
        );
        ws.send(float32ToInt16(resampled).buffer);
      };

      sourceNode.connect(processorNode);
      processorNode.connect(silentGain);
      silentGain.connect(audioContext.destination);
    }

    // Server sends raw 16-bit PCM chunks (linear16), not MP3/WAV — do not use decodeAudioData().
    async function playIncomingPcm(arrayBuffer) {
      try {
        if (!ttsPlaybackActive) {
          return;
        }
        const playGeneration = ttsGeneration;
        await ensurePlaybackContext();
        if (!ttsPlaybackActive || playGeneration !== ttsGeneration) {
          return;
        }
        if (arrayBuffer.byteLength < 2) {
          return;
        }
        const int16 = new Int16Array(arrayBuffer);
        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) {
          float32[i] = int16[i] / 0x8000;
        }
        const audioBuffer = audioContext.createBuffer(1, float32.length, ttsSampleRate);
        audioBuffer.copyToChannel(float32, 0);
        if (!ttsPlaybackActive || playGeneration !== ttsGeneration) {
          return;
        }
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(playbackGain || audioContext.destination);
        activeTtsSources.add(source);
        source.onended = () => activeTtsSources.delete(source);

        const now = audioContext.currentTime;
        if (nextPlayTime < now) {
          nextPlayTime = now;
        }
        source.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;
        statusText.innerText = "Speaking...";
      } catch (err) {
        console.error("Error playing PCM response:", err);
      }
    }

    // Back-compat name used by older deployed builds (those used decodeAudioData and failed on linear16).
    const playIncomingAudio = playIncomingPcm;

    function stopCall() {
      isCalling = false;
      callBtn.classList.remove("active");
      statusText.innerText = "Tap to speak";

      if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
      }
      playbackGain = null;
      if (micStream) {
        micStream.getTracks().forEach((track) => track.stop());
        micStream = null;
      }
      if (audioContext && audioContext.state !== "closed") {
        audioContext.close();
        audioContext = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }
      stopTtsPlayback();
      outputEncoding = "linear16";
    }
  </script>
</body>
</html>
