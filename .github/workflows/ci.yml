name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cart
          POSTGRES_PASSWORD: cart
          POSTGRES_DB: cart_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cart -d cart_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://cart:cart@localhost:5432/cart_recovery
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy
      - name: Migrate
        run: python -m alembic upgrade head
      - name: Test
        run: python -m pytest
