services:
  app:
    build: .
    restart: unless-stopped
    # Loopback only for host-side debugging; public traffic goes through nginx
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      POSTGRES_USER: ${POSTGRES_USER:-cart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cart}
      POSTGRES_DB: ${POSTGRES_DB:-cart_recovery}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cart}:${POSTGRES_PASSWORD:-cart}@postgres:5432/${POSTGRES_DB:-cart_recovery}
      REDIS_URL: redis://redis:6379/0
      CART_ABANDONMENT_TIMEOUT_SECONDS: ${CART_ABANDONMENT_TIMEOUT_SECONDS:-1800}
      CART_ABANDONMENT_SWEEP_INTERVAL_SECONDS: ${CART_ABANDONMENT_SWEEP_INTERVAL_SECONDS:-10}
      CART_ABANDONMENT_SWEEPER_ENABLED: ${CART_ABANDONMENT_SWEEPER_ENABLED:-true}
      REDIS_ABANDONMENT_STREAM: ${REDIS_ABANDONMENT_STREAM:-store:cart-abandoned}
      REDIS_ABANDONMENT_EMITTED_PREFIX: ${REDIS_ABANDONMENT_EMITTED_PREFIX:-store:abandonment}
      STORE_DELIVERY_FEE: ${STORE_DELIVERY_FEE:-4.99}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INTENT_MODEL: ${INTENT_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cart}
      POSTGRES_DB: ${POSTGRES_DB:-cart_recovery}
    # Not published to the host — app reaches it on the compose network
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # VPS: certs live in cart-recovery/certbot while compose runs in cart-recovery/ReCart
      - ${CERTBOT_CONF_DIR:-../certbot/conf}:/etc/letsencrypt:ro
      - ${CERTBOT_WWW_DIR:-../certbot/www}:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ${CERTBOT_CONF_DIR:-../certbot/conf}:/etc/letsencrypt
      - ${CERTBOT_WWW_DIR:-../certbot/www}:/var/www/certbot
    # Renew periodically; initial cert is issued via scripts/init-letsencrypt.sh
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
